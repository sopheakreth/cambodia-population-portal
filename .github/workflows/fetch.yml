name: Scheduled data pull

on:
  schedule:
    - cron: "17 1 * * 1"      # every Monday 01:17 UTC (08:17 Phnom Penh)
  workflow_dispatch:           # "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull census + World Bank
        run: python -m src.fetch
      - name: Rebuild processed tables
        run: python scripts/build_processed.py
      - name: Commit updated data and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/logs
          git diff --cached --quiet || git commit -m "Scheduled data pull $(date -u +%F)"
          git push
